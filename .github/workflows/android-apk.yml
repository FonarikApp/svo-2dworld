name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build SVO 2D MIR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game archive
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip

          mkdir -p /tmp/svo-project

          unzip -q SVO-2D-MIR-v1.6-playable-build.zip \
            -d /tmp/svo-project

          test -d /tmp/svo-project/android
          test -d /tmp/svo-project/web

          cp -a /tmp/svo-project/android ./android
          cp -a /tmp/svo-project/web ./web

          echo "Game files extracted successfully"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          echo "Android SDK is ready"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project
        working-directory: android
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          echo "Android project structure verified"

      - name: Build Android APKs
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace \
            assembleDebug \
            assembleRelease

      - name: Verify APK files
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"

          ls -lh "$DEBUG_APK" "$RELEASE_APK"

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: SVO-2D-MIR-Android-APKs
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
